<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <style>
        .logDiv {
            position: fixed;
            right: 100px;
            top: 10px;
        }

        ul {
            list-style-type: none;
        }

        .reloadBtn {
            display: none;
        }
    </style>
</head>

<body>
    <button id="rock" class="controls">Rock</button>
    <button id="paper" class="controls">Paper</button>
    <button id="scissors" class="controls">Scissors</button>
    <div class="result">
        <p id="choices">
            Player chose: <span id="playerChoice"></span><br>
            Computer chose: <span id="computerChoice"></span><br>
        </p>
        <p id="winner">Winner: None</p>
        <p id="rounds">Rounds played: <span id="roundCount">0</span></p>
        <p id="score">
            <span id="scoreType">Current</span> game score: <br>
            Player: <span id="playerScore">0</span><br>
            Computer: <span id="computerScore">0</span><br>
        </p>
        <button id="reloadBtn" class="reloadBtn">Play Again</button>
    </div>
    <div class="logDiv">
        GAME LOG
        <ul id="log">
        </ul>
    </div>
</body>

</html>
