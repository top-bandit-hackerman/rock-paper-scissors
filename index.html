<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
</head>

<body>
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>
    <div class="result">
        <p id="choices">
            Player chose: <span id="playerChoice"></span><br>
            Computer chose: <span id="computerChoice"></span><br>
        </p>
        <p id="winner">Winner: None</p>
        <p id="score">
            Current game score: <br>
            Player: <span id="playerScore">0</span><br>
            Computer: <span id="computerScore">0</span><br>
        </p>
    </div>
</body>

</html>
